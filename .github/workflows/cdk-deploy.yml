# Central, reusable CDK pipeline for ALL Data-Science projects (and the platform
# itself). Identical behaviour in the master repo and every consumer repo — they
# call it with a thin caller pinned by @tag.
#
# Trigger model (the caller wires `on:` for pull_request + push main/tags):
#   PR opened/updated  -> deploy an EPHEMERAL preview stack to the DEV account,
#                         named `pr-<n>-<stack>` (STACK_PREFIX). Same-repo only.
#   PR closed/merged   -> destroy that preview stack.
#   push to main       -> deploy `<stack>` to dev (continuous).
#   push tag vX.Y.Z    -> promote `<stack>`: dev -> preprod -> prod.
#                         preprod & prod are reachable ONLY via a release tag.
#
# AWS wiring is platform-owned — a Data Scientist sets NOTHING. The platform team
# provisions, per stage (repo or org GitHub *variables* — not secrets, ARNs aren't
# secret), the account id, and an OIDC deploy role named `${deploy_role_name}`
# whose trust policy allows `repo:<owner>/<repo>:environment:<stage>`. The role ARN
# is derived from account id + name convention; the account ids also feed the
# registry so synth resolves the right baseline. See ADR 0008/0010/0011.
name: cdk-deploy

on:
  workflow_call:
    inputs:
      stack_name:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: eu-west-1
      deploy_role_name:
        required: false
        type: string
        default: paved-cdk-github-deploy

permissions:
  id-token: write # OIDC into the target account
  contents: read

env:
  # Account ids (platform-set GitHub variables) — feed the registry so synth
  # resolves the per-account baseline deterministically.
  PAVED_CDK_DEV_ACCOUNT_ID: ${{ vars.PAVED_CDK_DEV_ACCOUNT_ID }}
  PAVED_CDK_PREPROD_ACCOUNT_ID: ${{ vars.PAVED_CDK_PREPROD_ACCOUNT_ID }}
  PAVED_CDK_PROD_ACCOUNT_ID: ${{ vars.PAVED_CDK_PROD_ACCOUNT_ID }}

jobs:
  validate:
    name: lint + synth
    runs-on: ubuntu-latest
    # No AWS role: synth is offline & deterministic (ADR 0008). Governance aspects
    # (permissions boundary, encryption enforcer) run during synth.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - run: uv run ruff check .
      - name: cdk synth (governance aspects run; synth fails on violations)
        run: uv run cdk synth

  # ---- Pull request: ephemeral preview stack in the DEV account ----------------
  preview:
    name: PR preview → dev (pr-${{ github.event.pull_request.number }})
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      STACK_PREFIX: pr-${{ github.event.pull_request.number }}-
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.PAVED_CDK_DEV_ACCOUNT_ID }}:role/${{ inputs.deploy_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - run: uv run cdk deploy --all --require-approval never
      - name: Comment the preview stack on the PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STACK: ${{ inputs.stack_name }}
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- cdk-preview -->';
            const body = `${marker}\n🚀 **Preview deployed to dev** as \`pr-${process.env.PR}-${process.env.STACK}\` (ephemeral; destroyed when this PR closes).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  preview-teardown:
    name: PR closed → destroy preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    env:
      STACK_PREFIX: pr-${{ github.event.pull_request.number }}-
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.PAVED_CDK_DEV_ACCOUNT_ID }}:role/${{ inputs.deploy_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - run: uv run cdk destroy --all --force

  # ---- main push: continuous deploy to dev -------------------------------------
  deploy-dev:
    name: deploy → dev
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.PAVED_CDK_DEV_ACCOUNT_ID }}:role/${{ inputs.deploy_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - run: uv run cdk deploy --all --require-approval never

  # ---- release tag only: promote to preprod then prod --------------------------
  deploy-preprod:
    name: deploy → preprod (release only)
    needs: deploy-dev
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.PAVED_CDK_PREPROD_ACCOUNT_ID }}:role/${{ inputs.deploy_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - run: uv run cdk deploy --all --require-approval never

  deploy-prod:
    name: deploy → prod (release only)
    needs: deploy-preprod
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod # set Required Reviewers on this GitHub Environment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.PAVED_CDK_PROD_ACCOUNT_ID }}:role/${{ inputs.deploy_role_name }}
          aws-region: ${{ inputs.aws_region }}
      - run: uv run cdk deploy --all --require-approval never
