# Platform-driven consumer onboarding: writes the consumer repo ONCE via a PR.
# The platform team runs this (workflow_dispatch). It renders the thin bootstrap for
# the chosen variant and opens a single PR into the (initialized) consumer repo.
# Thereafter the platform never writes again — updates are dependency pin bumps.
#
# Requires a repo/org secret ONBOARDING_TOKEN: a PAT or GitHub-App token with
# `contents:write` + `pull-requests:write` on the target consumer repos.
name: onboard-consumer

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo of the consumer repo (initialized, has a main branch)"
        required: true
      variant:
        description: "consumption model"
        required: true
        type: choice
        options: [sdk, declarative, copier]
      project_name:
        required: true
      service_id:
        required: true
      owner_email:
        required: true
      team:
        required: true
        default: ds
      cost_center:
        required: true
        default: "4711"
      platform_version:
        required: true
        default: v0.2.0

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Render the bootstrap fileset
        run: |
          python scripts/onboard.py --variant "${{ inputs.variant }}" --out bootstrap \
            --project-name "${{ inputs.project_name }}" --service-id "${{ inputs.service_id }}" \
            --owner "${{ inputs.owner_email }}" --team "${{ inputs.team }}" \
            --cost-center "${{ inputs.cost_center }}" --platform-repo "${{ github.repository }}" \
            --platform-version "${{ inputs.platform_version }}"
      - name: Open the one-time bootstrap PR in the consumer repo
        env:
          GH_TOKEN: ${{ secrets.ONBOARDING_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.target_repo }}.git" "$tmp"
          # Skip files the consumer owns once they exist (never overwrite runtime code).
          for f in $(cd bootstrap && find . -type f); do
            dest="$tmp/$f"
            if [ -e "$dest" ] && echo "$f" | grep -qE 'handlers/|notebooks/|app.py|service.yaml'; then
              echo "skip existing consumer file: $f"; continue
            fi
            mkdir -p "$(dirname "$dest")"; cp "bootstrap/$f" "$dest"
          done
          cd "$tmp"
          branch="platform/onboard-${{ inputs.variant }}"
          git config user.name "paved-cdk-platform"
          git config user.email "platform@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Platform onboarding: ${{ inputs.variant }} bootstrap for ${{ inputs.project_name }}"
          git push -u origin "$branch"
          gh pr create --repo "${{ inputs.target_repo }}" --base main --head "$branch" \
            --title "Platform onboarding (${{ inputs.variant }})" \
            --body "One-time platform bootstrap (variant: ${{ inputs.variant }}). The platform library is a **pinned dependency** — future updates are version-pin bumps and your runtime code under handlers/ and notebooks/ is never overwritten. CDK runs only in CI."
